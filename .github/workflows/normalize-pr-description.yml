name: PR Description

on:
  pull_request_target:
    types: [opened, edited, ready_for_review]

permissions:
  pull-requests: write

jobs:
  normalize:
    name: PR Description
    if: |
      github.repository_owner == 'palmshed' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'app/dependabot'
    runs-on: ubuntu-latest
    steps:
      - name: Validate description against the PR template
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const missing = ['## Changes', '## Validation'].filter(
              (heading) => !body.includes(heading),
            );
            if (missing.length) {
              core.setFailed(
                `${pr.html_url}\n\nDescription is missing template section(s): ` +
                  `${missing.join(', ')}.\n\nCopy .github/pull_request_template.md ` +
                  'into the description and fill in both sections.',
              );
            }